<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thesaurus Graph</title>
  <link rel="stylesheet" href="app.css">
  <!-- Cytoscape core + fcose (force-directed) layout. From jsDelivr for
       reliability; pinned versions so rendering doesn't drift. -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
</head>
<body>
  <header>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="search for a word..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="suggestions" role="listbox"></div>
    </div>
    <label class="control">
      Depth <input id="depth" type="range" min="1" max="5" value="2">
      <span id="depthVal">2</span>
    </label>
    <button id="reset" type="button">Reset</button>
    <span id="status"></span>
  </header>
  <main id="cy"></main>
  <footer>
    <small>Click a node to expand its neighborhood. Drag to pan, scroll to zoom. Enter to search.</small>
  </footer>
  <script src="app.js"></script>
</body>
</html>
